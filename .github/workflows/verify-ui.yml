name: Verify UI browsers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-browser:
    name: UI browser tests
    runs-on: ubuntu-latest
    # Keep browser dependencies off the slow Ubuntu package mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
      - run: pnpm --filter @bolerish/ui exec playwright install chromium firefox webkit
      # Firefox rejects a root process with another user's mounted home.
      - run: chown "$(id -u):$(id -g)" "$HOME"
      - run: pnpm --filter @bolerish/ui test:browser
      - name: Upload browser and axe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-accessibility
          path: packages/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
