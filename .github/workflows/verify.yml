name: Verify

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      format_only: ${{ steps.scope.outputs.format_only }}
      ui: ${{ steps.scope.outputs.ui }}
      docs: ${{ steps.scope.outputs.docs }}
      routes: ${{ steps.scope.outputs.routes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/ci-scope.ts >> "$GITHUB_OUTPUT"

  checks:
    name: static checks and unit tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
      - if: needs.changes.outputs.format_only == 'true'
        run: pnpm format:check
      - if: needs.changes.outputs.format_only != 'true'
        run: pnpm check
      - if: needs.changes.outputs.format_only != 'true'
        run: node --experimental-strip-types --test scripts/ci-scope.test.ts docs/test/responsive-routes.test.ts .github/workflows/metadata.test.mjs
      - if: needs.changes.outputs.format_only != 'true'
        run: pnpm test

  ui-browser:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/verify-ui.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/verify-docs.yml
    with:
      routes: ${{ needs.changes.outputs.routes }}

  verify:
    name: verify
    if: always()
    needs: [changes, checks, ui-browser, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          for (const name of ["changes", "checks"]) {
            if (jobs[name].result !== "success") process.exit(1);
          }
          for (const [name, output] of [["ui-browser", "ui"], ["docs", "docs"]]) {
            const expected = jobs.changes.outputs[output] === "true" ? "success" : "skipped";
            if (jobs[name].result !== expected) process.exit(1);
          }
          JS
