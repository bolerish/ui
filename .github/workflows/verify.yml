name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
      docs: ${{ steps.scope.outputs.docs }}
      routes: ${{ steps.scope.outputs.routes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/ci-scope.ts >> "$GITHUB_OUTPUT"

  checks:
    name: static checks and unit tests
    runs-on: ubuntu-latest
    # Keep browser dependencies off the slow Ubuntu package mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: node --experimental-strip-types --test scripts/ci-scope.test.ts docs/test/responsive-routes.test.ts .github/workflows/metadata.test.mjs
      - run: pnpm test

  ui-browser:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/verify-ui.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/verify-docs.yml
    with:
      routes: ${{ needs.changes.outputs.routes }}

  verify:
    name: verify
    if: always()
    needs: [changes, checks, ui-browser, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          for (const name of ["changes", "checks"]) {
            if (jobs[name].result !== "success") process.exit(1);
          }
          for (const [name, output] of [["ui-browser", "ui"], ["docs", "docs"]]) {
            const expected = jobs.changes.outputs[output] === "true" ? "success" : "skipped";
            if (jobs[name].result !== expected) process.exit(1);
          }
          JS
