name: Verify documentation

on:
  workflow_call:
    inputs:
      routes:
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  build:
    name: build documentation once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:docs
      - run: tar -cf "$RUNNER_TEMP/docs-build.tar" docs/dist/client docs/public packages/ui/dist
      - uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: ${{ runner.temp }}/docs-build.tar
          retention-days: 1

  browser:
    needs: build
    name: browser (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Keep browser dependencies off the slow Ubuntu package mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      DOCS_RESPONSIVE_ROUTES: ${{ inputs.routes }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: docs-build
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/docs-build.tar"
      - run: pnpm --filter @bolerish/docs test:browser --shard=${{ matrix.shard }}/2
      - name: Upload responsive layout reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-responsive-layout-${{ matrix.shard }}
          path: docs/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    needs: build
    name: static, HTTP, agent and dev contracts
    runs-on: ubuntu-latest
    # Keep browser dependencies off the slow Ubuntu package mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: docs-build
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/docs-build.tar"
      - run: pnpm --filter @bolerish/docs test:static
      - name: Verify static HTTP contracts
        run: |
          pnpm --filter @bolerish/docs exec wrangler dev --config wrangler.jsonc --port 3004 > /tmp/docs-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3004/ > /dev/null; then break; fi
            sleep 1
          done
          DOCS_URL=http://localhost:3004 pnpm --filter @bolerish/docs test:runtime
      - run: pnpm --filter @bolerish/docs test:agent
      - run: pnpm --filter @bolerish/docs exec node --experimental-strip-types --test test/dev.test.ts test/dev-theme.test.ts
